#
# Development Configuration for Local Testing
#
# This config file overrides _config.yml settings for local development.
# It allows you to test the site locally without modifying production settings.
#
# Usage:
#   jekyll serve --config _config.yml,_config_dev.yml
#
# The second config file (_config_dev.yml) will override settings from the first.
#

# Local Development URLs
url: 'http://localhost:4000'
baseurl: ''
urlimg: 'http://localhost:4000/images/'

# Disable production features
google_analytics_tracking_id: false
# google_site_verification: false
# bing_webmastertools_id: false

# Sass - Expanded output for easier debugging
sass:
  style: :expanded
  line_numbers: true
  sass_dir: _sass

# HTML Compression - Disable for development (easier debugging)
compress_html:
  clippings: none
  comments: all
  endings: none
  profile: false
  ignore:
    envs: [development]

# Jekyll Gist - Disable noscript for faster development
gist:
  noscript: false

# Development optimizations
incremental: true        # Faster rebuilds (only regenerate changed files)
# show_drafts: true      # Uncomment to show posts in _drafts folder
# future: true           # Uncomment to show posts with future dates
# unpublished: false     # Uncomment to hide posts marked as unpublished

# Keep Jekyll verbose for debugging
# verbose: true          # Uncomment for detailed build output
